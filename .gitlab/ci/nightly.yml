# ───────────────────| Git Sentinel - Nightly child pipeline |──────────────────
#
# Only ever triggered via trigger:nightly in the top-level .gitlab-ci.yml, and
# only when check:nightly determined main has moved since the last successful
# nightly publish - in that case check:nightly copies this file verbatim into
# generated-nightly.yml, which is what actually runs. When main hasn't moved,
# check:nightly generates a single no-op job instead and this file is never
# used, so nothing here needs its own "is there anything to do?" gate.

default:
  interruptible: true
  tags:
    - linux

stages:
  - test
  - build
  - publish

variables:
  BINARY: git-sentinel
  PACKAGE: git-sentinel

# ────────────────────────────────────────────────────────────────────| Test |──

test:
  stage: test
  image: python:3.14
  before_script:
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - uv run scripts/test.py
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'

test:windows:
  stage: test
  tags:
    - windows
  before_script:
    - pip install uv --quiet
  script:
    - uv sync --frozen --group dev
    - uv run scripts/test.py
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'

# ───────────────────────────────────────────────────| Shared build template |──

.build:
  stage: build
  image: python:3.14
  variables:
    # Same cache strategy as the regular `build` job in .gitlab-ci.yml - see
    # the comment there. Same cache key too, so nightly and MR builds share
    # one warm Nuitka/ccache cache instead of each maintaining its own.
    NUITKA_CACHE_DIR: $CI_PROJECT_DIR/.nuitka-cache
    CCACHE_DIR: $CI_PROJECT_DIR/.ccache
  cache:
    key: nuitka-linux
    paths:
      - .nuitka-cache/
      - .ccache/
  before_script:
    # patchelf is required by Nuitka's onefile/standalone mode on Linux;
    # ccache lets repeat builds skip recompiling unchanged C files.
    - apt-get update -qq && apt-get install -y -qq patchelf ccache
    - pip install uv --quiet
  artifacts:
    expire_in: 3 days

# Console and windowed binaries build as separate jobs (per platform) so they
# run in parallel instead of one job building both sequentially - see
# .gitlab-ci.yml's build section for the full rationale and the
# DISABLE_TUI_BUILD kill switch, which applies here too.
#
# Suffixes APP_VERSION with "-nightly.<short SHA>" before Nuitka runs so
# the compiled binary reports e.g. "git-sentinel v0.2.0-nightly.a1b2c3d" - this
# only mutates the CI job's worktree, never committed anywhere.
build:nightly:
  extends: .build
  before_script:
    - !reference [.build, before_script]
    - python3 scripts/patch_nightly_version.py "$CI_COMMIT_SHORT_SHA"
  script:
    - bash scripts/build.sh console
  artifacts:
    paths:
      - dist/git-sentinel
  needs: [test, test:windows]
  rules:
      # not when the TUI build is disabled
    - if: $DISABLE_TUI_BUILD == "true"
      when: never

      # otherwise always
    - when: always

build:linux-gui:nightly:
  extends: .build
  before_script:
    - !reference [.build, before_script]
    - python3 scripts/patch_nightly_version.py "$CI_COMMIT_SHORT_SHA"
  script:
    - bash scripts/build.sh gui
  artifacts:
    paths:
      - dist/git-sentinel-gui
  needs: [test, test:windows]

# Windows builds. Nuitka auto-fetches a portable MinGW64 compiler on first
# use (--assume-yes-for-downloads in build.ps1 avoids an interactive
# prompt). See build:nightly above for the version suffixing rationale.
.build:windows:nightly:
  stage: build
  tags:
    - windows
  needs: [test, test:windows]
  before_script:
    - pip install uv --quiet
    - python scripts/patch_nightly_version.py "$CI_COMMIT_SHORT_SHA"
    - uv sync --frozen --group dev

build:windows:nightly:
  extends: .build:windows:nightly
  script:
    - pwsh scripts/build.ps1 console
  artifacts:
    paths:
      - dist/git-sentinel.exe
    expire_in: 3 days
  rules:
      # not when the TUI build is disabled
    - if: $DISABLE_TUI_BUILD == "true"
      when: never

      # otherwise always
    - when: always

build:windows-gui:nightly:
  extends: .build:windows:nightly
  script:
    - pwsh scripts/build.ps1 gui
  artifacts:
    paths:
      - dist/git-sentinel-gui.exe
    expire_in: 3 days

# ─────────────────────────────────────────────────| Shared publish template |──

.publish:
  stage: publish
  image: curlimages/curl:latest
  interruptible: false # never cancel a mid-flight upload
  script:
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "dist/$BINARY" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$PACKAGE_VERSION/$BINARY"

# Overwrites the single "nightly" entry on every scheduled run that has
# changes. Skipped along with build:nightly when DISABLE_TUI_BUILD is set -
# the nightly-sha.txt marker (below, on publish:linux-gui:nightly, which
# always runs) stays decoupled from this so main-moved detection keeps
# working regardless of the flag.
publish:nightly:
  extends: .publish
  needs:
    - job: build:nightly
      optional: true
  variables:
    PACKAGE_VERSION: nightly
  rules:
      # not when the TUI build is disabled
    - if: $DISABLE_TUI_BUILD == "true"
      when: never

      # otherwise always
    - when: always

# Also records $CI_COMMIT_SHA as nightly-sha.txt so the next scheduled run's
# check:nightly (in the parent pipeline) can detect whether main has moved
# since this build - lives here (rather than on publish:nightly) because
# this job always runs, regardless of DISABLE_TUI_BUILD.
publish:linux-gui:nightly:
  extends: .publish
  needs: [build:linux-gui:nightly]
  variables:
    PACKAGE_VERSION: nightly
    BINARY: git-sentinel-gui
  script:
    - !reference [.publish, script]
    - |
      echo -n "$CI_COMMIT_SHA" > nightly-sha.txt
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file nightly-sha.txt \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/nightly/nightly-sha.txt"

publish:windows:nightly:
  extends: .publish
  needs:
    - job: build:windows:nightly
      optional: true
  variables:
    PACKAGE_VERSION: nightly
    BINARY: git-sentinel.exe
  rules:
      # not when the TUI build is disabled
    - if: $DISABLE_TUI_BUILD == "true"
      when: never

      # otherwise always
    - when: always

publish:windows-gui:nightly:
  extends: .publish
  needs: [build:windows-gui:nightly]
  variables:
    PACKAGE_VERSION: nightly
    BINARY: git-sentinel-gui.exe
